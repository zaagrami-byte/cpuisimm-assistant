# Réglages non secrets. Toute variable d'environnement du .env prime sur ce fichier.
language: fr
dry_run: true
log_level: INFO
log_dir: logs

llm:
  model: qwen2.5:3b
  host: http://localhost:11434
  timeout_s: 40
  temperature: 0.2
  num_ctx: 4096
  keep_alive: 30m
  max_history_turns: 6      # échanges conservés (utilisateur + assistant)
  max_tool_rounds: 4

stt:
  model: small
  device: cpu
  compute_type: int8
  beam_size: 1
  timeout_s: 30
  model_dir: models/whisper
  # Hallucinations typiques de Whisper sur du bruit : ignorées
  ignore_phrases:
    - "Sous-titrage ST' 501"
    - "Sous-titres réalisés par la communauté d'Amara.org"
    - "Merci d'avoir regardé cette vidéo"
    - "Merci d'avoir regardé cette vidéo !"

tts:
  model: models/fr_FR-siwis-medium.onnx

vad:                        # mêmes valeurs validées que l'ancien assistant
  mode: 3
  frame_ms: 20
  start_window_ms: 300
  start_ratio: 0.7
  end_silence_ms: 1000
  end_ratio: 0.85
  max_utterance_s: 15
  min_utterance_ms: 300

audio:
  bind_host: 0.0.0.0
  port: 5005
  sample_rate: 16000
  peer_timeout_s: 6
  ping_interval_s: 2

ros:
  domain_id: 0
  nav_action: navigate_to_pose
  map_frame: map
  base_frame: base_link
  status_timeout_s: 3.0

robot:
  # estop  : stop_robot annule le but Nav2 ET publie /emergency_stop (réarmement humain)
  # cancel : stop_robot annule seulement le but Nav2
  stop_mode: estop

wake:                       # écoute permanente par défaut ; activer pour un mot-clé
  enabled: false
  phrases: ["bonjour robot", "hey isimm"]
  session_s: 30

knowledge_file: knowledge/isimm_knowledge.yaml
locations_file: knowledge/locations.yaml
